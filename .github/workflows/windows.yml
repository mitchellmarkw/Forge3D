# SPDX-License-Identifier: GPL-3.0-or-later
# Builds Forge3D on Windows, runs the unit tests, and uploads a ready-to-run zip (for
# testing) and the installer. Download them from the run's "Artifacts" section.
# Publishing a release: Actions -> Windows build -> Run workflow on main with "Publish"
# ticked (or push a version tag, v0.25.0). It makes the tag and a GitHub release with the
# installer and a portable zip; see docs/RELEASING.md.

name: Windows build

# Push only: a pull request's checks come from its branch's push run, so a separate
# pull_request trigger would build everything twice.
on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release of this version (tag vX.Y.Z from CMakeLists.txt)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publishing a release when a version tag is pushed

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300   # the first run builds Qt and OpenCASCADE from source; later runs reuse the cache

    steps:
      - uses: actions/checkout@v4

      - name: Restore compiled libraries (vcpkg cache)
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          # Every run saves under its own key, so a cancelled or failed run can never
          # block a later, more complete cache from being saved. Restore takes the newest.
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Prepare the vcpkg cache folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      # Also sets VCPKG_ROOT to the copy of vcpkg that ships with Visual Studio.
      # Package versions are still pinned by "builtin-baseline" in vcpkg.json.
      - name: Set up the MSVC compiler and vcpkg
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Make sure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { pip install ninja }
          ninja --version
          cmake --version
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"

      - name: Configure (installs Qt, OpenCASCADE, Catch2 through vcpkg)
        run: cmake --preset windows-release

      - name: Save compiled libraries (vcpkg cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Build
        run: cmake --build --preset windows-release

      - name: Unit tests
        run: ctest --preset windows-release

      - name: Package
        shell: pwsh
        run: |
          $build = 'build\windows-release'
          $installed = "$build\vcpkg_installed\x64-windows"
          $dist = 'dist\Forge3D'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item "$build\bin\Forge3D.exe", "$build\bin\Forge3D.pdb" $dist -ErrorAction SilentlyContinue
          Copy-Item "$build\bin\*.dll" $dist
          Copy-Item "$installed\bin\*.dll" $dist -Force

          # Qt plugins (platform integration, styles, image formats)
          $windeployqt = "$installed\tools\Qt6\bin\windeployqt.exe"
          if (Test-Path $windeployqt) {
            & $windeployqt --release --no-translations --no-system-d3d-compiler --no-compiler-runtime "$dist\Forge3D.exe"
          }
          if (-not (Test-Path "$dist\platforms\qwindows.dll")) {
            Write-Host 'windeployqt did not deploy plugins; copying them directly'
            foreach ($p in 'platforms', 'styles', 'imageformats', 'tls') {
              if (Test-Path "$installed\Qt6\plugins\$p") {
                Copy-Item -Recurse -Force "$installed\Qt6\plugins\$p" $dist
              }
            }
          }
          if (-not (Test-Path "$dist\platforms\qwindows.dll")) { throw 'qwindows.dll missing from package' }
          # Secure connections (Help -> Check for Updates) need Qt's TLS plugin.
          if (-not (Test-Path "$dist\tls\qschannelbackend.dll") -and (Test-Path "$installed\Qt6\plugins\tls")) {
            Copy-Item -Recurse -Force "$installed\Qt6\plugins\tls" $dist
          }
          if (-not (Test-Path "$dist\tls\qschannelbackend.dll")) { throw 'Qt TLS plugin (qschannelbackend.dll) missing from package' }

          # The Visual C++ runtime, so the app runs on PCs without the redistributable installed
          $crt = Get-ChildItem -Directory "$env:VCToolsRedistDir\x64" -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if ($crt) { Copy-Item "$($crt.FullName)\*.dll" $dist -Force }

          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md $dist -ErrorAction SilentlyContinue

          # Every shipped library's license, as vcpkg installed it (share\<port>\copyright).
          # Build-only tools and Catch2 (tests) are left out.
          $skip = @('catch2', 'vcpkg-cmake', 'vcpkg-cmake-config', 'vcpkg-cmake-get-vars', 'vcpkg-tool-meson', 'vcpkg-pkgconfig-get-modules')
          $licenses = "$dist\licenses"
          New-Item -ItemType Directory -Force -Path $licenses | Out-Null
          foreach ($port in Get-ChildItem -Directory "$installed\share") {
            $copyright = Join-Path $port.FullName 'copyright'
            if ((Test-Path $copyright) -and ($skip -notcontains $port.Name)) {
              New-Item -ItemType Directory -Force -Path "$licenses\$($port.Name)" | Out-Null
              Copy-Item $copyright "$licenses\$($port.Name)\LICENSE.txt"
            }
          }
          if (-not (Test-Path "$licenses\qtbase\LICENSE.txt")) { throw 'Qt license missing from package' }
          if (-not (Test-Path "$licenses\opencascade\LICENSE.txt")) { throw 'OpenCASCADE license missing from package' }
          # The Visual C++ runtime's terms ship with it in the redistributable folder.
          if ($crt) {
            $crtTerms = Get-ChildItem -File "$env:VCToolsRedistDir" -Filter '*.txt' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($crtTerms) { Copy-Item $crtTerms.FullName "$licenses\Microsoft-Visual-C++-runtime.txt" }
          }
          New-Item -ItemType Directory -Force -Path "$dist\test-sheets" | Out-Null
          Copy-Item docs\test-sheets\*.md "$dist\test-sheets"
          Copy-Item -Recurse docs\test-sheets\samples "$dist\test-sheets\samples"
          Get-ChildItem -Recurse $dist | Select-Object -ExpandProperty FullName

      - name: Version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          $version = [regex]::Match($cmake, 'project\(Forge3D\s+VERSION\s+([0-9.]+)').Groups[1].Value
          $label = [regex]::Match($cmake, 'set\(FORGE_RELEASE_LABEL\s+"([^"]*)"\)').Groups[1].Value
          if (-not $version) { throw 'Version not found in CMakeLists.txt' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          Write-Host "Forge3D $version $label"

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup (ISCC.exe) not found' }
          $version = '${{ steps.version.outputs.version }}'
          $label = '${{ steps.version.outputs.label }}'
          $out = (New-Item -ItemType Directory -Force -Path release).FullName
          & $iscc "/DAppVersion=$version" "/DAppLabel=$label" "/DSourceDir=$((Resolve-Path dist\Forge3D).Path)" "/DOutputDir=$out" installer\Forge3D.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          # The portable zip: the same files, without the testing material.
          $portable = 'portable\Forge3D'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -Recurse dist\Forge3D\* $portable -Exclude 'test-sheets'
          Get-ChildItem -Recurse $portable -Filter *.pdb | Remove-Item
          Compress-Archive -Path $portable -DestinationPath "$out\Forge3D-$version-portable.zip" -CompressionLevel Optimal
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload Forge3D for testing
        uses: actions/upload-artifact@v4
        with:
          name: Forge3D-windows-x64-${{ github.sha }}
          path: dist/Forge3D
          retention-days: 30

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Forge3D-Setup-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: release
          retention-days: 30

      # For a version tag (v0.25.0) pushed by hand, or Run workflow with "Publish" ticked
      # (which makes the tag on this commit). The version comes from CMakeLists.txt.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $label = '${{ steps.version.outputs.label }}'
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) {
            throw "Tag ${{ github.ref_name }} doesn't match the version in CMakeLists.txt ($tag)"
          }
          $title = "Forge3D $version $label".Trim()
          $notes = "docs\release-notes\$tag.md"
          if (-not (Test-Path $notes)) { throw "Release notes $notes are missing" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "There's already a release $tag. Bump the version first." }
          gh release create $tag (Get-ChildItem release\*).FullName --title $title --notes-file $notes --target '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw "Publishing failed ($LASTEXITCODE)" }
